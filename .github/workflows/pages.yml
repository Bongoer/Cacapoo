name: Build graphical Web QEMU x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/configure-pages@v5
      - name: Restore compiled QEMU runtime
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: graphical-qemu-x86-64-v2-${{ hashFiles('build-runtime.sh') }}
      - name: Compile graphical QEMU x86_64
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: chmod +x build-runtime.sh && ./build-runtime.sh
      - name: Prepare static site
        run: chmod +x prepare-site.sh && ./prepare-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
